<!DOCTYPE html>
<html>
<head>

<style>

</style>
</head>

<body>

<header>🎬 MovieZone PRO</header>

<div class="container">

<!-- SMART LINK -->

</a>

<br><br>

<input id="search" onkeyup="searchMovie()" placeholder="Search movie...">

<div id="movies"></div>

</div>

<!-- ADS -->

<div id="container-60390897b23391755e785d2b01613229"></div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBV9tYBEH45LNk5CGTRnc_LLLA8HfvZjo8",
  authDomain: "cinemazone-60864.firebaseapp.com",
  databaseURL: "https://cinemazone-60864-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "cinemazone-60864"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const box = document.getElementById("movies");

onValue(ref(db,"movies"), snap=>{
  box.innerHTML="";
  snap.forEach(i=>{
    let d=document.createElement("div");
    d.className="movie";
    d.innerText=i.val().name;
    box.appendChild(d);
  });
});

window.searchMovie=function(){
  let val=document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".movie").forEach(m=>{
    m.style.display=m.innerText.toLowerCase().includes(val)?"block":"none";
  });
}

</script>

</body>
</html>
