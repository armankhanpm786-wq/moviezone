<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<style>
body{
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
}
input,button{padding:10px;margin:5px;}
button{background:red;color:white;border:none;}
.movie{background:#222;margin:5px;padding:10px;}
</style>
</head>

<body>

<h2>🔐 ADMIN LOGIN</h2>

<input id="email" placeholder="Email"><br>
<input id="pass" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>

<div id="panel" style="display:none">

<h3>Add Movie</h3>
<input id="movie">
<button onclick="addMovie()">Add</button>

<h3>Movies</h3>
<div id="list"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "cinemazone-60864.firebaseapp.com",
  databaseURL: "https://cinemazone-60864-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "cinemazone-60864"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

window.login=function(){
  signInWithEmailAndPassword(auth,email.value,pass.value)
  .then(()=>{
    panel.style.display="block";
  })
  .catch(()=>alert("Login failed"));
}

window.addMovie=function(){
  push(ref(db,"movies"),{name:movie.value});
  movie.value="";
}

onValue(ref(db,"movies"),snap=>{
  list.innerHTML="";
  snap.forEach(i=>{
    let d=document.createElement("div");
    d.className="movie";
    d.innerHTML=i.val().name+
    ` <button onclick="del('${i.key}')">X</button>`;
    list.appendChild(d);
  });
});

window.del=function(id){
  remove(ref(db,"movies/"+id));
}

</script>

</body>
</html>
